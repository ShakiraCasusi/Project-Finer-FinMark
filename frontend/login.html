<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinMark Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container flex">
      <div class="finmark-page flex">
        <!-- Logo + marketing text -->
        <div class="text">
          <h1>FinMark</h1>
          <p>Connect with your finances<br />and grow with FinMark.</p>
        </div>

        <!-- Login form -->
        <form id="login-form" action="#">
          <div id="login-error" class="error-message"></div>
          <input type="email" placeholder="Email" required />
          <input type="password" placeholder="Password" required />

          <div class="link">
            <button type="submit" class="login">Login</button>
            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <hr />

          <div class="button">
            <a href="#" id="show-register">Create new account</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Registration Modal -->
    <div id="register-modal" class="modal" style="display:none;">
      <div class="modal-content fb-modal">
        <span id="close-register" class="close">&times;</span>
        <h2 class="fb-title">Create a new account</h2>
        <p class="fb-subtitle">It's quick and easy.</p>
        <form id="register-form">
          <div id="register-error" class="error-message"></div>
          <input type="email" placeholder="Email" required class="fb-input" />
          <input type="password" placeholder="Password" required class="fb-input" />
          <input type="password" placeholder="Confirm Password" required class="fb-input" />
          <button type="submit" class="fb-btn" disabled>Sign Up</button>
        </form>
      </div>
    </div>

    <div id="loading" class="loading-spinner" style="display:none;"></div>

    <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>

    <script src="login.js"></script>
  </body>
</html>
