<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinMark Login</title>
    <link rel="stylesheet" href="login.css" />
    <style>
      /* Dark blue text when typing */
      .typed-input {
        color: #0a2259 !important;
      }
    </style>
  </head>
  <body>
    <div class="login-bg">
      <div class="login-left">
        <h1><span style="color:#fff;">Welcome to</span> <span class="brand">FinMark</span></h1>
        <p>Sign into your account and get immediate access to all of your financials.</p>
      </div>
      <div class="login-card">
        <form id="login-form" class="modern-login" autocomplete="off">
          <h2 class="login-title">Sign In</h2>
          <div id="login-error" class="error-message"></div>
          <label>Email Address</label>
          <input type="email" required class="fb-input" id="email-input" placeholder="example@gmail.com" />
          <label>Password</label>
          <div class="password-row">
            <input type="password" required class="fb-input" id="password-input" />
          </div>
          <div class="forgot-row">
            <a href="#" class="forgot">Forgot Password?</a>
          </div>
          <button type="submit" class="login" disabled>Sign In</button>
        </form>
        <button id="open-register" class="register-btn" type="button">Create Account</button>
      </div>
    </div>

    <div id="loading" class="loading-spinner" style="display:none;"></div>
    <script src="login.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        if (!form) return;

        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          const email = form.querySelector('input[type="email"]').value;
          const password = form.querySelector('input[type="password"]').value;

          try {
            const res = await fetch('http://127.0.0.1:3000/api/login', { 
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
              window.location.href = 'dashboard.html';
            } else {
              alert(data.message || 'Login failed');
            }
          } catch (err) {
            alert('Error connecting to server.');
          }
        });

        document.getElementById('open-register').onclick = function() {
          window.location.href = 'register.html';
        };

        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        [emailInput, passwordInput].forEach(input => {
          input.addEventListener('input', function() {
            if (input.value.length > 0) {
              input.classList.add('typed-input');
            } else {
              input.classList.remove('typed-input');
            }
          });
        });
      });
    </script>
  </body>
</html>
